name: Linux Arch draft build
on:
  workflow_dispatch:
  pull_request:
    paths: &linux_paths
      - 'lib/**'
      - 'test/**'
      - 'rust/**'
      - 'native/**'
      - 'linux/**'
      - 'third_party/**'
      - 'assets/**'
      - 'pubspec.*'
      - 'scripts/**'
      - 'packaging/arch/**'
      - 'LINUX.md'
      - '.github/workflows/linux.yml'
  push:
    branches: [master, feat/arch-linux-desktop]
    paths: *linux_paths
permissions:
  contents: read
concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  arch:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Host OS only runs the container; package ABI comes from this Arch image.
    container:
      image: archlinux:base@sha256:d4594bb2300cba11f41c2f27923eb56f63d9988909c402f9c95517d1e362c899
    env:
      FLUTTER_ROOT: /opt/flutter
      PUB_CACHE: /home/builder/.pub-cache
      CARGO_HOME: /home/builder/.cargo
      CARGO_NET_OFFLINE: 'true'
    steps:
      - name: Prepare isolated Arch snapshot (never the host)
        run: |
          printf 'Server = https://archive.archlinux.org/repos/2026/11/09/$repo/os/$arch\n' > /etc/pacman.d/mirrorlist
          pacman -Syyuu --noconfirm
          pacman -S --needed --noconfirm base-devel git clang cmake ninja pkgconf gtk3 libsecret mpv libepoxy libglvnd libx11 dbus xdg-utils hicolor-icon-theme jre21-openjdk rust python nodejs ffmpeg patchelf desktop-file-utils zstd unzip xz curl webkit2gtk-4.1 speech-dispatcher libspeechd espeak-ng xdg-desktop-portal
          useradd -m builder
          rustc --version | grep -E '^rustc 1\.99\.1 '
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fetch exact official Flutter SDK
        run: |
          curl --fail --location --retry 3 https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.9-stable.tar.xz -o /tmp/flutter.tar.xz
          echo '25ed8c3c29d51a7353f2a944310b478af8214920639524b19c50a19e6c044c5a  /tmp/flutter.tar.xz' | sha256sum -c -
          tar -xJf /tmp/flutter.tar.xz -C /opt
          chown -R builder:builder /opt/flutter "$GITHUB_WORKSPACE"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            /home/builder/.pub-cache
            /home/builder/.cargo/registry
            /home/builder/.cargo/git
          key: arch-20261109-x64-flutter3.47.9-rust1.99.1-frb2.13-${{ hashFiles('pubspec.lock', 'rust/Cargo.lock') }}
      - name: Resolve locked inputs and run automatic gates
        shell: bash
        run: |
          chown -R builder:builder /home/builder
          runuser -u builder -- bash -euo pipefail <<'BUILD'
          export PATH="$FLUTTER_ROOT/bin:$PATH"
          mkdir -p build/validation/linux
          flutter --version --machine > build/validation/linux/flutter.json
          python -c 'import json; assert json.load(open("build/validation/linux/flutter.json"))["frameworkRevision"] == "c197ca5199e9ee5661e865596c9c07294dfab51c"'
          grep -q 'flutter_rust_bridge = "=2.13.0"' rust/Cargo.toml
          flutter precache --linux
          flutter pub get --enforce-lockfile
          # SDK migration adds an analysis exclusion; preserve committed source.
          git restore --source=HEAD -- analysis_options.yaml
          CARGO_NET_OFFLINE=false cargo fetch --manifest-path rust/Cargo.toml --locked
          flutter analyze --no-pub
          cargo test --manifest-path rust/Cargo.toml --locked 2>&1 | tee build/validation/linux/cargo-test.txt
          cargo build --manifest-path rust/Cargo.toml --release --locked
          export FQAPP_RUST_HOST_LIB="$PWD/rust/target/release/libfqapi_core.so"
          test -s "$FQAPP_RUST_HOST_LIB"
          flutter test --no-pub --reporter json test/rust_host_integration_test.dart > build/validation/linux/frb.jsonl
          python - <<'PY'
          import json
          events = [json.loads(s) for s in open('build/validation/linux/frb.jsonl')]
          done = [e for e in events if e.get('type') == 'testDone']
          assert done and all(not e.get('skipped') and e['result'] == 'success' for e in done)
          assert any(e.get('type') == 'done' and e.get('success') for e in events)
          PY
          flutter test --no-pub
          node --test test/verify_audio_cenc_test.cjs
          python scripts/verify_windows_media.py
          python test/linux_packaging_test.py
          bash packaging/arch/build_release.sh
          nm -D build/linux/x64/release/bundle/lib/libfqapi_core.so > build/validation/linux/core-symbols.txt
          for symbol in fq_desktop_media_open fq_desktop_media_close fq_desktop_media_free; do
            grep -q " $symbol$" build/validation/linux/core-symbols.txt
          done
          bash scripts/build_linux_package.sh build/linux/x64/release/bundle build/arch-package HEAD
          git diff --exit-code -- pubspec.lock rust/Cargo.lock
          pacman -Q > build/validation/linux/arch-packages.txt
          printf '%s\n' 'DRAFT: ignored upstream tests are not passes; W/XWayland/X11, real accounts, keyring, clean install and licensing remain unverified.' > build/validation/linux/ACCEPTANCE.txt
          BUILD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fqapp-arch-x86_64-draft-${{ github.sha }}
          path: |
            build/arch-package/*.pkg.tar.zst
            build/arch-package/PKGBUILD
            build/arch-package/.SRCINFO
            build/arch-package/fqapp-bundle.tar.zst
            build/arch-package/*report.txt
            build/arch-package/build-manifest.txt
            build/arch-package/fqapp-source.tar.zst
            build/arch-package/source-PKGBUILD
            build/arch-package/license-inventory.txt
            build/validation/linux/**
            build/validation/linux-media/*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: linux-failure-evidence-${{ github.sha }}
          path: |
            build/validation/linux/**
            build/arch-package/elf-report.txt
          if-no-files-found: ignore
